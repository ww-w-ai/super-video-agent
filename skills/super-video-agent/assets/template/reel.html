<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { display: block; }
  @font-face {
    font-family: 'Pretendard';
    src: url('assets/fonts/Pretendard-Regular.otf');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('assets/fonts/Pretendard-Bold.otf');
    font-weight: 700;
    font-style: normal;
  }
{{HANDWRITING_FONT_FACE}}
</style>
</head>
<body>
<canvas id="stage" width="{{WIDTH}}" height="{{HEIGHT}}"></canvas>
<script>
/* ENGINE:BEGIN — scripts/engine/reel-engine.js, inlined by new-reel.mjs. Not scanned for banned tokens (verify.mjs only scans SCENE). */
{{ENGINE_SOURCE}}
/* ENGINE:END */
</script>
<script>
/* AUDIO:BEGIN — scripts/engine/reel-audio.js, inlined by new-reel.mjs. Not scanned for banned tokens (verify.mjs only scans SCENE). */
{{AUDIO_SOURCE}}
/* AUDIO:END */
</script>
<script>
/* SCENE:BEGIN */
(function () {
  "use strict";
  var WIDTH = {{WIDTH}};
  var HEIGHT = {{HEIGHT}};
  var FPS = {{FPS}};
  var HAS_HANDWRITING = {{HAS_HANDWRITING}};

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  var timings = null;
  var tl = null;
  var shots = [];
  var libManifest = null; // assets/lib/manifest.json, or null when absent
  var libCues = []; // assets/lib/cues.json's cues, or [] when absent

  // Reel.layer()/Reel.dubCode() (references/pipeline.md "Picture first"):
  // ?layer=captions[&dub=<code>] asks this page to draw only its overlay
  // (captions and any text), skipping the picture — for dub.mjs and for
  // review.mjs --scan --layer captions. __reel.layers below declares that
  // this scaffold supports it — dub.mjs falls back to its own default
  // caption look for a page that doesn't. Reel.layerFiles picks the files.
  var layer = Reel.layer();
  var dubCode = Reel.dubCode();
  var isCaptionLayer = layer === "captions";
  var basePlan = null; // plan.json
  var files = null; // Reel.layerFiles(plan.meta.lang), set once plan.json is read
  var dubPlan = null; // that language's plan, loaded only in caption-layer mode

  // The one allowed network call in scene code (design.md §2.1 exception):
  // loading local JSON as part of building `ready`. `required` files
  // (timings.json) throw when missing; optional ones (the asset library's
  // manifest/cues, design.md §2.5) resolve to null so a reel with no
  // assets/lib/ folder works exactly as before.
  function loadJSON(url, required) {
    return fetch(url).then(function (res) {
      if (!res.ok) {
        if (required) throw new Error(url + " not found — run voice.mjs first");
        return null;
      }
      return res.json();
    });
  }

  // The first of `urls` that exists; a base-language caption layer falls
  // back from dub/<base>/ to the film's own files (Reel.layerFiles).
  function loadFirstJSON(urls, required) {
    var i = 0;
    function next() {
      if (i >= urls.length) {
        if (required) throw new Error(urls.join(" or ") + " not found — run voice.mjs (or dub.mjs) first");
        return null;
      }
      return loadJSON(urls[i++], false).then(function (data) {
        return data == null ? next() : data;
      });
    }
    return Promise.resolve().then(next);
  }

  // plan.json: meta.lang picks the layer files; meta.filmKey/meta.title/
  // meta.id -> ReelAudio.setFilmKey (reel-audio.js: gives this film's kit
  // sfx a character of their own — references/sound.md "Kit"). Optional: a
  // reel with no plan.json (should not happen) falls back to "film" rather
  // than failing ready.
  function loadBasePlan() {
    return loadJSON("plan.json", false).catch(function () {
      return null;
    }).then(function (plan) {
      basePlan = plan;
      var meta = (plan && plan.meta) || {};
      ReelAudio.setFilmKey(meta.filmKey || meta.title || meta.id || "film");
      files = Reel.layerFiles(meta.lang || "ko-KR");
    });
  }

  function loadTimings() {
    return loadFirstJSON(files.timings, true).then(function (data) {
      timings = data;
      tl = Reel.timeline(timings);
      // Shot i spans from line i's start (the first shot from 0) to line
      // i+1's start (the last shot to the timeline duration), so shots
      // tile the whole film — including any gapMs silence between lines
      // — instead of leaving a blank, un-owned scene in each gap.
      // readAt stays the midpoint of the spoken line, not the shot span.
      var lines = timings.lines || [];
      shots = lines.map(function (l, i) {
        var start = i === 0 ? 0 : l.start;
        var end = i === lines.length - 1 ? timings.duration : lines[i + 1].start;
        return { id: l.id, start: start, end: end, readAt: (l.start + l.end) / 2 };
      });
      buildSfxCues();
    });
  }

  // dub/<code>/plan.json (plan.json for the base language) — that
  // language's per-line fields (e.g. an `emphasis` word list) and its
  // meta.overlay text for a film's own overlay code to key off, keeping pace
  // with the dub text rather than the base language's. Only loaded in
  // caption-layer mode.
  function loadDubPlan() {
    if (!isCaptionLayer) return Promise.resolve();
    return loadFirstJSON(files.plan, true).then(function (data) {
      dubPlan = data;
    });
  }

  // ---- asset library (design.md §2.5): manifest + cues, then preload
  // every video clip's frames so clipFrame(id, tLocal) is instant during
  // seek(t). Absent files (no assets/lib/) leave libManifest null and
  // libCues empty — nothing else here changes behavior in that case.
  function loadAssetLibrary() {
    return Promise.all([
      loadJSON("assets/lib/manifest.json", false),
      loadJSON("assets/lib/cues.json", false),
    ]).then(function (results) {
      libManifest = results[0];
      libCues = (results[1] && results[1].cues) || [];
      return preloadClipFrames();
    });
  }

  function frameFileName(index) {
    var s = String(index);
    while (s.length < 5) s = "0" + s;
    return "frame-" + s + ".jpg";
  }

  // Resolves once the image is decoded, not just loaded: `onload` alone
  // lets the first seek draw an image that is still decoding, so a cold
  // first frame differs from a warm one.
  function loadImage(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        img.decode().then(
          function () { resolve(img); },
          function () { resolve(img); }
        );
      };
      img.onerror = function () {
        Reel.recordIssue({ type: "clip-frame-load-failed", src: src });
        resolve(null);
      };
      img.src = src;
    });
  }

  function preloadClipFrames() {
    if (!libManifest || !libManifest.assets) return Promise.resolve();
    var ids = Object.keys(libManifest.assets);
    return Promise.all(
      ids.map(function (id) {
        var meta = libManifest.assets[id];
        if (meta.kind !== "video") return null;
        var frameUrls = [];
        for (var i = 0; i < meta.frameCount; i++) {
          frameUrls.push(meta.frameDir + "/" + frameFileName(i));
        }
        return Promise.all(frameUrls.map(loadImage)).then(function (frames) {
          Reel.registerClip(id, frames, meta.fps);
        });
      })
    );
  }

  // soundCues() -> [{file, at, gainDb, maxSec}] for every library cue whose
  // resolved `play` is "sound" or "both" (design.md §2.5). render.mjs reads
  // this through the page and mixes each `file` at its cue time itself —
  // this page never plays audio.
  function soundCues() {
    if (!libManifest || libCues.length === 0 || !timings) return [];
    var out = [];
    libCues.forEach(function (cue) {
      if (cue.play !== "sound" && cue.play !== "both") return;
      var line = null;
      for (var i = 0; i < timings.lines.length; i++) {
        if (timings.lines[i].id === cue.lineId) {
          line = timings.lines[i];
          break;
        }
      }
      var meta = libManifest.assets[cue.asset];
      if (!line || !meta) return;
      var file = meta.kind === "audio" ? meta.file : meta.audio;
      if (!file) return; // e.g. a silent video clip cued for sound
      out.push({
        file: file,
        at: Reel.cueTime(cue, line, timings),
        gainDb: cue.gainDb == null ? 0 : cue.gainDb,
        maxSec: cue.maxSec,
        // Sound-only files may start with silence; render.mjs skips it so the
        // sound lands on the cue. A clip's sound keeps its lead to stay on its picture.
        soundOnly: meta.kind === "audio",
      });
    });
    return out;
  }

  // drawLibCues(t) — draws the frame of any picture cue ("picture"|"both")
  // whose clip window [cueTime, cueTime+durationSec) contains t, on top of
  // the active scene. A pure function of t: which clip and which of its
  // frames follow only from the cued asset's own duration and cueTime.
  function drawLibCues(t) {
    if (!libManifest || libCues.length === 0 || !timings) return;
    libCues.forEach(function (cue) {
      if (cue.play !== "picture" && cue.play !== "both") return;
      var line = null;
      for (var i = 0; i < timings.lines.length; i++) {
        if (timings.lines[i].id === cue.lineId) {
          line = timings.lines[i];
          break;
        }
      }
      var meta = libManifest.assets[cue.asset];
      if (!line || !meta || meta.kind !== "video") return;
      var at = Reel.cueTime(cue, line, timings);
      var durationSec = cue.maxSec ? Math.min(cue.maxSec, meta.durationSec) : meta.durationSec;
      if (t < at || t >= at + durationSec) return;
      var frame = Reel.clipFrame(cue.asset, t - at);
      if (frame) Reel.imageCover(ctx, frame, 0, 0, WIDTH, HEIGHT);
    });
  }

  // ---- audio: SFX_CUES + renderSfx -----------------------------------
  // SFX_CUES times should be derived from the measured timeline (tl.line /
  // tl.phrase), not hardcoded constants, so retiming a line moves its cue
  // with it. Cue shape: {at, kind, gain, pan, sync}.
  var SFX_CUES = [];
  function buildSfxCues() {
    SFX_CUES = [];
  }

  // renderSfx(sampleRate) -> [Float32Array, Float32Array], one per channel,
  // exactly duration*sampleRate samples (mix()'s length contract). Builds a
  // ducked music-box bed plus the SFX_CUES onsets, then masters it.
  // Typed arrays, never plain Arrays: a 5-minute film as plain numbers ran
  // Node out of heap in render.mjs; Playwright passes typed arrays back as
  // they are.
  function renderSfx(sampleRate) {
    var duration = timings ? timings.duration : 0;
    var m = ReelAudio.mix(duration, sampleRate);
    var bed = ReelAudio.musicBed(duration, sampleRate, { bpm: 120, key: "C", gain: 0.18 });
    var narrationWindows = (timings && timings.lines ? timings.lines : []).map(function (l) {
      return { start: l.start, end: l.end };
    });
    ReelAudio.duck(bed, narrationWindows, { depthDb: -10, rampMs: 120 });
    m.addStereo(bed, 0, 1);
    SFX_CUES.forEach(function (cue) {
      var gen = ReelAudio.sfx[cue.kind];
      if (!gen) return;
      var buf = gen(sampleRate, { seed: cue.kind + ":" + cue.at });
      m.add(buf, cue.at, cue.gain == null ? 1 : cue.gain, cue.pan == null ? 0 : cue.pan);
    });
    // master() normalizes to a PEAK, not a loudness — with no SFX_CUES (the
    // unedited scaffold), this mix is just the ducked bed, and peakDb: -3
    // pushed the bed itself up to near-clipping: a promo session measured
    // the resulting music ending up as loud as the voice after render.mjs's
    // final mastering. -15 here (12dB lower) keeps the bed well under a
    // -16 LUFS voice by default (references/sound.md "Mix"): about -28 LUFS
    // short-term during narration windows, on top of the -10dB duck above.
    // A real signature effect (a `sync:true` cue) is a much shorter,
    // punchier signal than the bed alone and will not be pinned this quiet.
    ReelAudio.master(m, { peakDb: -15 });
    return [m.L, m.R];
  }

  // sfxStems(sampleRate) -> Promise<[{id, at, L, R}]> — each SFX_CUES kit
  // effect rendered alone (no bed, no other cues, no master gain), for
  // scripts/sfx-cards.mjs's `measure` (references/sound.md "Sound cards").
  // Optional: a page that never calls this still works with everything
  // else; sfx-cards.mjs then falls back to measuring library cue files
  // directly and reports which cards it could not measure. `id` is the
  // cue's own `id` when SFX_CUES sets one (recommended, so it matches a
  // sound card's id exactly); otherwise "<kind>@<at>".
  function sfxStems(sampleRate) {
    var out = SFX_CUES.map(function (cue) {
      var gen = ReelAudio.sfx[cue.kind];
      if (!gen) return null;
      var buf = gen(sampleRate, { seed: cue.kind + ":" + cue.at });
      var arr = Float32Array.from(buf);
      return { id: cue.id || (cue.kind + "@" + cue.at), at: cue.at, L: arr, R: arr };
    }).filter(Boolean);
    return Promise.resolve(out);
  }

  // document.fonts.ready alone only guarantees a @font-face has been
  // *parsed*, not fetched — a font that is only ever used on canvas (never
  // in DOM text) is never triggered to load by the browser, so ctx.fillText
  // silently falls back to a system font. Explicitly .load() every
  // declared face before resolving `ready`; a face that fails to load is
  // reported through issues() (not a hang, not a thrown rejection) so a
  // missing/broken font file shows up in review instead of hanging capture.
  function loadDeclaredFonts() {
    var faces = Array.from(document.fonts); // FontFaceSet is set-like; slice.call gives []
    return Promise.all(
      faces.map(function (face) {
        return face.load().catch(function (err) {
          Reel.recordIssue({
            type: "font-load-failed",
            family: face.family,
            weight: face.weight,
            style: face.style,
            message: String((err && err.message) || err),
          });
          return null;
        });
      })
    ).then(function () {
      return document.fonts.ready;
    });
  }

  // ORDER TRAP: `ready` starts its loaders right here, before the scene
  // block below has run. A loader you add (images, a paper texture) may
  // call a function from that block — functions are hoisted — but a `var`
  // it reads there (an image-name list, a config object) is still
  // `undefined` at this point, and the throw leaves window.__reel unset.
  // Declare such values above this line, or start the loader one tick later
  // (Promise.resolve().then(loadMyImages)).
  var ready = Promise.all([
    loadDeclaredFonts(),
    loadBasePlan().then(function () {
      return isCaptionLayer ? Promise.all([loadTimings(), loadDubPlan()]) : loadTimings().then(loadAssetLibrary);
    }),
  ]).then(function () { return undefined; });

  // ---- scene ---------------------------------------------------------
  // Replace this. Draw your film in the medium you chose (medium.md).
  // Nothing here is a style suggestion.
  // Code here runs after `ready` was built above — see ORDER TRAP.
  //
  // This stub only proves the plumbing works: it clears to a neutral grey,
  // draws the current line's text plainly at the centre, and applies one
  // tiny keyed boil offset so a dead-air check doesn't fail on an
  // unedited scaffold.
  function drawStub(t, line) {
    var fontPx = Math.round(HEIGHT * 0.05);
    var b = Reel.boil("stub:text", t, { amp: 1.5, rot: 0 });
    ctx.save();
    ctx.translate(WIDTH / 2 + b.dx, HEIGHT / 2 + b.dy);
    ctx.font = fontPx + "px sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(line ? line.text : "", 0, 0);
    ctx.restore();
  }

  var SCENES = [drawStub];

  function currentLineIndex(t) {
    if (!timings) return -1;
    for (var i = 0; i < timings.lines.length; i++) {
      var l = timings.lines[i];
      if (t >= l.start && t < l.end) return i;
    }
    // after the last line's end, keep showing the last line's caption
    if (timings.lines.length && t >= timings.lines[timings.lines.length - 1].end) {
      return timings.lines.length - 1;
    }
    return -1;
  }

  // activeShotIndex(t) — which tiled shot t falls in. `shots` (built in
  // loadTimings) spans line i's start to line i+1's start (the last shot to
  // the film's end), one shot per line, so a gap between one line's spoken
  // end and the next line's start still belongs to the shot before it.
  // Unlike currentLineIndex (the *spoken* window, which is -1 in a gap),
  // this never falls through to -1 once shots exist: seek() uses it to pick
  // the scene function so the picture holds the previous line's scene
  // through a gap instead of jumping back to SCENES[0].
  function activeShotIndex(t) {
    if (!shots.length) return -1;
    for (var i = 0; i < shots.length; i++) {
      if (t >= shots[i].start && t < shots[i].end) return i;
    }
    return shots.length - 1; // at or after the film's end: hold the last shot
  }

  // drawCaptions(t) — this film's own caption look, drawn when
  // Reel.layer()==="captions" (dub.mjs "let the reel draw its own
  // captions", references/pipeline.md "Picture first"). Replace the
  // Reel.caption() call below with your own draw code (e.g. a word-by-word
  // highlight) — dubPlan (dub/<code>/plan.json, that language's own lines)
  // carries whatever per-line fields it needs to key off, such as an
  // `emphasis` word list, for the language currently loaded.
  function drawCaptions(t) {
    var idx = currentLineIndex(t);
    var line = idx >= 0 ? timings.lines[idx] : null;
    Reel.caption(ctx, line, t, { width: WIDTH, height: HEIGHT });
  }

  // seek(t): pure function of t. Background paint + scene dispatch by the
  // active line index, wrapping if there are fewer scenes than lines. In
  // caption-layer mode the picture is skipped entirely: clear to
  // transparent (dub.mjs composites this over the picture) and draw only
  // captions.
  function seek(t) {
    if (isCaptionLayer) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      drawCaptions(t);
      return;
    }
    ctx.save();
    ctx.fillStyle = "#808080";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.restore();
    // Scene selection follows the tiled shot (activeShotIndex), not the
    // spoken-line window (currentLineIndex): shots span line i's start to
    // line i+1's start, one shot per line (loadTimings), so a gap between
    // lines still resolves to the shot — and that shot's line data — before
    // it, instead of wrapping to SCENES[0] with no line.
    var idx = activeShotIndex(t);
    var line = idx >= 0 ? timings.lines[idx] : null;
    var sceneFn = SCENES[Math.max(0, idx) % SCENES.length];
    var u = 0;
    if (idx >= 0 && tl) {
      var win = tl.line(idx);
      if (win) u = win.u(t);
    }
    sceneFn(t, line, u);
    drawLibCues(t);
  }

  window.__reel = {
    get width() { return WIDTH; },
    get height() { return HEIGHT; },
    get fps() { return FPS; },
    get duration() { return timings ? timings.duration : 0; },
    ready: ready,
    seek: seek,
    get shots() { return shots; },
    get layers() { return ["captions"]; },
    issues: function () { return Reel.issues(); },
    audio: { narration: "voice/narration.wav", renderSfx: renderSfx },
    sfxStems: sfxStems,
    soundCues: soundCues,
    get marks() {
      return SFX_CUES.map(function (c) {
        return { at: c.at, kind: c.kind, sync: !!c.sync };
      });
    },
  };
})();
/* SCENE:END */
</script>
</body>
</html>
